<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>サービスLP構成メーカー | Sample Prototype</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">1日プロトタイプ サンプル 03</p>
          <h1 id="page-title">サービスLP構成メーカー</h1>
          <p class="lead">
            サービス名、対象顧客、悩み、提供価値を入力すると、LPの見出し、セクション構成、CTAを整理します。
          </p>
        </div>
        <div class="status-card">
          <strong>構成案まで</strong>
          <span>本番ページ制作の前に、何を伝えるべきかを小さく固めるためのサンプルです。</span>
        </div>
      </section>

      <section class="workspace" aria-label="LP構成フォーム">
        <form id="lp-form" class="panel">
          <div class="panel-heading">
            <h2>サービス情報</h2>
            <p>架空の情報で試せます。個人情報や機密情報は入れないでください。</p>
          </div>

          <label>
            サービス名
            <input id="service-name" type="text" placeholder="例: はじめての動画編集レッスン">
          </label>

          <label>
            対象顧客
            <input id="target" type="text" placeholder="例: 副業を始めたい会社員">
          </label>

          <label>
            顧客の悩み
            <textarea id="problem" rows="4" placeholder="例: 何から学べばよいかわからず、独学で挫折しやすい"></textarea>
          </label>

          <label>
            提供価値
            <textarea id="value" rows="4" placeholder="例: 1本目の動画を完成させるところまで伴走する"></textarea>
          </label>

          <button type="submit">構成を作る</button>
        </form>

        <aside class="panel output-panel" aria-live="polite">
          <div class="panel-heading">
            <h2>LP構成案</h2>
            <p>見出し、流れ、CTAを出力します。</p>
          </div>
          <div id="output" class="empty-state">
            フォームを入力して構成を作成してください。
          </div>
          <button id="copy-output" class="secondary-button" type="button" disabled>構成案をコピー</button>
        </aside>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
